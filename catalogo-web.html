<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo — Distribuidora Almonte</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Distribuidora Almonte — Catálogo">
<meta property="og:description" content="Abanicos, colchones, aires, espaldares, utensilios del hogar y más. Toca para ver precios y hacer tu pedido.">
<meta property="og:image" content="https://eldeiviracing19371469-glitch.github.io/Distribuidora-almonte-/logo.jpg">
<meta property="og:url" content="https://eldeiviracing19371469-glitch.github.io/Distribuidora-almonte-/catalogo-web.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Distribuidora Almonte — Catálogo">
<meta name="twitter:description" content="Abanicos, colchones, aires, espaldares, utensilios del hogar y más.">
<meta name="twitter:image" content="https://eldeiviracing19371469-glitch.github.io/Distribuidora-almonte-/logo.jpg">
<link rel="icon" href="https://eldeiviracing19371469-glitch.github.io/Distribuidora-almonte-/logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface-2: #EFEBE2;
    --text: #1B2029;
    --text-muted: #6B7280;
    --border: #E4DFD3;
    --amber: #C97F1E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151C;
      --surface: #1B2029;
      --surface-2: #242B37;
      --text: #F2F4F7;
      --text-muted: #8A93A3;
      --border: #2C3341;
      --amber: #F2A93B;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
  }
  body { padding-bottom: 90px; }
  .logo-img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 8px;
    display: block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header {
    padding: 24px 20px 14px;
    text-align: center;
  }
  header h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
  }
  header .sub {
    font-size: 13px;
    color: var(--text-muted);
  }
  .search-wrap { padding: 0 20px 16px; }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
  }
  .category-header {
    padding: 18px 20px 8px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 0 20px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
  }
  .card .photos {
    position: relative;
    width: 100%;
    height: 140px;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    background: var(--surface-2);
  }
  .card .photos::-webkit-scrollbar { display: none; }
  .card .photos img {
    width: 100%;
    height: 140px;
    flex-shrink: 0;
    object-fit: cover;
    scroll-snap-align: start;
    cursor: pointer;
  }
  .card .dots {
    position: absolute;
    bottom: 6px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 4px;
    pointer-events: none;
  }
  .card .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
  }
  .card .dots span.active { background: #fff; }
  .card .ph {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    background: var(--surface-2);
  }
  .card .info { padding: 10px 12px 14px; }
  .card .name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .card .price {
    font-family: ui-monospace, monospace;
    font-weight: 700;
    color: var(--amber);
    font-size: 15px;
  }
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-size: 14px;
  }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 30px 20px 40px;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top));
    right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff; border: none;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--amber);
    color: #14151A;
    border: none;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-caption {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: 15px;
    font-weight: 500;
    padding: 0 60px;
  }
  .lightbox-caption .lc-price {
    display: block;
    color: var(--amber);
    font-family: ui-monospace, monospace;
    font-weight: 700;
    margin-top: 4px;
    font-size: 16px;
  }

  .whatsapp-fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: #25D366;
    color: #06210F;
    text-decoration: none;
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
    z-index: 30;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <img class="logo-img" src="logo.jpg" alt="Distribuidora Almonte">
  <h1>Distribuidora Almonte</h1>
  <div class="sub">Catálogo de artículos</div>
</header>

<div class="search-wrap">
  <input id="search-input" class="search-input" type="search" placeholder="Buscar artículo…">
</div>

<div id="catalog"></div>
<div id="empty-state" class="empty" style="display:none;">Aún no hay artículos disponibles.</div>

<footer>Precios sujetos a cambio sin previo aviso.</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<a class="whatsapp-fab" id="whatsapp-fab" href="https://wa.me/18294367015?text=Hola%2C%20quiero%20hacer%20un%20pedido" target="_blank">
  💬 Presione aquí para hacer su pedido
</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFZyY418EXYEDTZiY_HS71dWmCytczBOw",
  authDomain: "distribuidora-almonte.firebaseapp.com",
  projectId: "distribuidora-almonte",
  storageBucket: "distribuidora-almonte.firebasestorage.app",
  messagingSenderId: "664241923704",
  appId: "1:664241923704:web:be72ee04fd1cff73836f8d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let articulos = [];
let searchTerm = "";

function money(n) {
  return "RD$" + (Number(n) || 0).toLocaleString("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function computeSalePrice(costo, margen) {
  const c = Number(costo) || 0;
  const m = Number(margen) || 0;
  return c * (1 + m / 100);
}

function getFotos(a) {
  if (a.fotos && a.fotos.length) return a.fotos;
  if (a.fotoUrl) return [a.fotoUrl];
  return [];
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function render() {
  const catalog = document.getElementById("catalog");
  const emptyState = document.getElementById("empty-state");
  const filtered = articulos.filter(a =>
    (a.nombre || "").toLowerCase().includes(searchTerm.toLowerCase())
  );

  catalog.innerHTML = "";
  emptyState.style.display = articulos.length === 0 ? "block" : "none";

  const groups = new Map();
  filtered.forEach(a => {
    const cat = (a.categoria || "").trim() || "Otros";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(a);
  });

  const sortedCats = [...groups.keys()].sort((x, y) => {
    if (x === "Otros") return 1;
    if (y === "Otros") return -1;
    return x.localeCompare(y);
  });

  sortedCats.forEach(cat => {
    const header = document.createElement("div");
    header.className = "category-header";
    header.textContent = cat;
    catalog.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "grid";

    groups.get(cat).forEach(a => {
      const precio = computeSalePrice(a.precioEntrada, a.porcentajeGanancia);
      const fotos = getFotos(a);
      const card = document.createElement("div");
      card.className = "card";

      if (fotos.length === 0) {
        card.innerHTML = `
          <div class="ph">🏷️</div>
          <div class="info">
            <div class="name">${escapeHtml(a.nombre)}</div>
            <div class="price">${money(precio)}</div>
          </div>
        `;
      } else {
        const imgsHtml = fotos.map((url, i) =>
          `<img src="${url}" alt="" loading="lazy" data-idx="${i}">`
        ).join("");
        const dotsHtml = fotos.length > 1
          ? `<div class="dots">${fotos.map((_, i) => `<span class="${i === 0 ? "active" : ""}"></span>`).join("")}</div>`
          : "";
        card.innerHTML = `
          <div class="photos">${imgsHtml}${dotsHtml}</div>
          <div class="info">
            <div class="name">${escapeHtml(a.nombre)}</div>
            <div class="price">${money(precio)}</div>
          </div>
        `;

        const photosEl = card.querySelector(".photos");
        const dots = card.querySelectorAll(".dots span");

        if (fotos.length > 1) {
          photosEl.addEventListener("scroll", () => {
            const idx = Math.round(photosEl.scrollLeft / photosEl.clientWidth);
            dots.forEach((d, i) => d.classList.toggle("active", i === idx));
          });
        }

        photosEl.querySelectorAll("img").forEach(img => {
          img.addEventListener("click", () => {
            openLightbox(fotos, Number(img.dataset.idx), a.nombre || "", precio);
          });
        });
      }

      grid.appendChild(card);
    });

    catalog.appendChild(grid);
  });
}

// ---------- Visor de fotos (deslizable, por artículo) ----------
let gallery = [];
let galleryIndex = 0;
let galleryNombre = "";
let galleryPrecio = 0;
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxCaption = document.getElementById("lightbox-caption");
const lightboxClose = document.getElementById("lightbox-close");
const lightboxPrev = document.getElementById("lightbox-prev");
const lightboxNext = document.getElementById("lightbox-next");
const whatsappFab = document.getElementById("whatsapp-fab");
const whatsappGenerico = "https://wa.me/18294367015?text=Hola%2C%20quiero%20hacer%20un%20pedido";

function openLightbox(fotos, index, nombre, precio) {
  gallery = fotos;
  galleryIndex = index;
  galleryNombre = nombre;
  galleryPrecio = precio;
  showLightboxImage();
  lightbox.classList.add("open");
}
function showLightboxImage() {
  const url = gallery[galleryIndex];
  if (!url) return;
  lightboxImg.src = url;
  lightboxCaption.innerHTML = `${escapeHtml(galleryNombre)}<span class="lc-price">${money(galleryPrecio)}</span>`;
  lightboxPrev.style.visibility = gallery.length > 1 ? "visible" : "hidden";
  lightboxNext.style.visibility = gallery.length > 1 ? "visible" : "hidden";
  const mensaje = encodeURIComponent(`Hola, quiero hacer un pedido de: ${galleryNombre}`);
  whatsappFab.href = `https://wa.me/18294367015?text=${mensaje}`;
}
function lightboxGoPrev() {
  galleryIndex = (galleryIndex - 1 + gallery.length) % gallery.length;
  showLightboxImage();
}
function lightboxGoNext() {
  galleryIndex = (galleryIndex + 1) % gallery.length;
  showLightboxImage();
}
function closeLightbox() {
  lightbox.classList.remove("open");
  lightboxImg.src = "";
  whatsappFab.href = whatsappGenerico;
}
lightboxClose.addEventListener("click", closeLightbox);
lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); lightboxGoPrev(); });
lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); lightboxGoNext(); });
lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });

let touchStartX = null;
lightbox.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
lightbox.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const deltaX = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(deltaX) > 45) {
    if (deltaX > 0) lightboxGoPrev(); else lightboxGoNext();
  }
  touchStartX = null;
});

const articulosRef = collection(db, "articulos");
onSnapshot(articulosRef, (snap) => {
  articulos = snap.docs.map(d => d.data());
  articulos.sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
  render();
});

document.getElementById("search-input").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});
</script>

</body>
</html>
