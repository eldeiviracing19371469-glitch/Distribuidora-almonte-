<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Catálogo · Distribuidora Almonte</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232A6F5B'/%3E%3Ctext x='50' y='62' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif'%3EDA%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#FAFAF7;
    --ink:#1B1E1C;
    --ink-soft:#5B615C;
    --line:#E4E2DC;
    --accent:#2A6F5B;
    --accent-ink:#F4F9F6;
    --card:#FFFFFF;
    --danger:#B3452F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    height:100%; overflow-x:hidden;}
  body{padding-bottom:env(safe-area-inset-bottom);}

  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .titlebar{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  h1 span{display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-top:1px;}
  .add-btn{
    width:38px; height:38px; border-radius:50%; border:none;
    background:var(--accent); color:white; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .search{
    margin-top:12px; width:100%; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); font-size:15px; color:var(--ink);
  }
  .cats{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13.5px; color:var(--ink-soft); white-space:nowrap;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:white;}

  main{padding:14px 16px 90px;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px;}

  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden;
  }
  .card .ph{
    width:100%; aspect-ratio:1/1; background:#EFEDE7 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:#B9B6AC; font-size:12px;
  }
  .card .info{padding:9px 10px 11px;}
  .card .name{font-size:13.5px; font-weight:600; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .price{font-size:13px; color:var(--accent); font-weight:700; margin-top:3px;}
  .card .cat{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  /* Fullscreen viewer */
  .viewer{
    position:fixed; inset:0; background:#0E0F0E; z-index:50;
    display:none; flex-direction:column;
  }
  .viewer.open{display:flex;}
  .viewer .vtop{
    display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
  }
  .viewer .vtop button{
    background:rgba(255,255,255,0.12); border:none; color:white; border-radius:999px;
    width:34px; height:34px; font-size:16px;
  }
  .viewer .vimg{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:pinch-zoom;}
  .viewer .vimg img{max-width:100%; max-height:100%; object-fit:contain;}
  .viewer .vinfo{padding:16px 20px calc(env(safe-area-inset-bottom) + 20px); color:white;}
  .viewer .vinfo .name{font-size:19px; font-weight:700;}
  .viewer .vinfo .price{font-size:17px; color:#8FD6BB; font-weight:700; margin-top:4px;}
  .viewer .vinfo .cat{font-size:13px; color:#A9ACA6; margin-top:4px;}
  .viewer .vnav{
    position:absolute; top:50%; transform:translateY(-50%); width:100%;
    display:flex; justify-content:space-between; padding:0 4px; pointer-events:none;
  }
  .viewer .vnav button{
    pointer-events:auto; background:rgba(255,255,255,0.12); border:none; color:white;
    width:40px; height:40px; border-radius:50%; font-size:18px;
  }

  /* Modal form */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.45); z-index:60;
    display:none; align-items:flex-end;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheet h2{font-size:17px; margin:4px 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-size:15px; color:var(--ink);
  }
  .photo-input{
    border:1.5px dashed var(--line); border-radius:12px; padding:14px; text-align:center;
    color:var(--ink-soft); font-size:13.5px; position:relative; overflow:hidden;
  }
  .photo-input img{max-width:100%; max-height:160px; border-radius:8px; margin-top:8px;}
  .photo-input input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .row{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700;
  }
  .btn.primary{background:var(--accent); color:white;}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid #E7CFC7; flex:none; padding:13px 16px;}
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>Catálogo<span>Distribuidora Almonte</span></h1>
    <button class="add-btn" id="btnAdd">+</button>
  </div>
  <input class="search" id="search" placeholder="Buscar producto...">
  <div class="cats" id="cats"></div>
</header>

<main>
  <div id="empty" class="empty" style="display:none;">
    <b>Todavía no hay productos</b>
    Toca el botón + para agregar el primero con su foto y categoría.
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <div class="vtop">
    <button id="vClose">✕</button>
    <button id="vEdit">✎</button>
  </div>
  <div class="vimg"><img id="vImg" src="" alt=""></div>
  <div class="vnav">
    <button id="vPrev">‹</button>
    <button id="vNext">›</button>
  </div>
  <div class="vinfo">
    <div class="name" id="vName"></div>
    <div class="price" id="vPrice"></div>
    <div class="cat" id="vCat"></div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="formTitle">Nuevo producto</h2>
    <div class="field">
      <label>Foto</label>
      <div class="photo-input" id="photoBox">
        <span id="photoHint">Toca para tomar o elegir una foto</span>
        <img id="photoPreview" style="display:none;">
        <input type="file" accept="image/*" id="photoFile">
      </div>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input id="fName" placeholder="Ej: Arroz Selecto 5lb">
    </div>
    <div class="field">
      <label>Categoría</label>
      <input id="fCat" list="catList" placeholder="Ej: Granos">
      <datalist id="catList"></datalist>
    </div>
    <div class="field">
      <label>Precio (opcional)</label>
      <input id="fPrice" type="number" inputmode="decimal" placeholder="Ej: 150">
    </div>
    <div class="row">
      <button class="btn danger" id="btnDelete" style="display:none;">Eliminar</button>
      <button class="btn ghost" id="btnCancel">Cancelar</button>
      <button class="btn primary" id="btnSave">Guardar</button>
    </div>
  </div>
</div>

<script>
// ---------- IndexedDB ----------
const DB_NAME = 'catalogo-almonte';
let db;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')){
        d.createObjectStore('products', { keyPath:'id' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}
function allProducts(){
  return new Promise((resolve) => {
    const tx = db.transaction('products','readonly');
    const store = tx.objectStore('products');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b)=> b.createdAt - a.createdAt));
  });
}
function saveProduct(p){
  return new Promise((resolve) => {
    const tx = db.transaction('products','readwrite');
    tx.objectStore('products').put(p);
    tx.oncomplete = () => resolve();
  });
}
function deleteProduct(id){
  return new Promise((resolve) => {
    const tx = db.transaction('products','readwrite');
    tx.objectStore('products').delete(id);
    tx.oncomplete = () => resolve();
  });
}

// ---------- State ----------
let products = [];
let activeCat = 'Todos';
let searchTerm = '';
let editingId = null;
let viewerList = [];
let viewerIndex = 0;
let pendingPhoto = null;

// ---------- Elements ----------
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const catsEl = document.getElementById('cats');
const searchEl = document.getElementById('search');

// ---------- Render ----------
function render(){
  const cats = ['Todos', ...new Set(products.map(p=>p.category).filter(Boolean))];
  catsEl.innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');

  let list = products;
  if(activeCat !== 'Todos') list = list.filter(p => p.category === activeCat);
  if(searchTerm) list = list.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

  viewerList = list;
  emptyEl.style.display = products.length === 0 ? 'block' : 'none';
  grid.innerHTML = list.map((p,i) => `
    <div class="card" data-id="${p.id}">
      <div class="ph" style="${p.photo?`background-image:url('${p.photo}')`:''}">${p.photo?'':'sin foto'}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        ${p.price ? `<div class="price">RD$ ${Number(p.price).toLocaleString()}</div>` : ''}
        ${p.category ? `<div class="cat">${escapeHtml(p.category)}</div>` : ''}
      </div>
    </div>
  `).join('');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

catsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  activeCat = btn.dataset.cat;
  render();
});
searchEl.addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;
  const idx = viewerList.findIndex(p => p.id === id);
  openViewer(idx);
});

// ---------- Viewer ----------
const viewer = document.getElementById('viewer');
function openViewer(idx){
  viewerIndex = idx;
  showViewerItem();
  viewer.classList.add('open');
}
function showViewerItem(){
  const p = viewerList[viewerIndex];
  if(!p) return;
  document.getElementById('vImg').src = p.photo || '';
  document.getElementById('vName').textContent = p.name;
  document.getElementById('vPrice').textContent = p.price ? `RD$ ${Number(p.price).toLocaleString()}` : '';
  document.getElementById('vCat').textContent = p.category || '';
}
document.getElementById('vClose').onclick = () => viewer.classList.remove('open');
document.getElementById('vPrev').onclick = () => {
  viewerIndex = (viewerIndex - 1 + viewerList.length) % viewerList.length;
  showViewerItem();
};
document.getElementById('vNext').onclick = () => {
  viewerIndex = (viewerIndex + 1) % viewerList.length;
  showViewerItem();
};

// Deslizar entre fotos (swipe)
const vimg = document.querySelector('.viewer .vimg');
let touchStartX = 0, touchStartY = 0, touchMoved = false;
vimg.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchMoved = false;
}, { passive:true });
vimg.addEventListener('touchmove', () => { touchMoved = true; }, { passive:true });
vimg.addEventListener('touchend', e => {
  if(!touchMoved || viewerList.length < 2) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Solo reaccionar a deslizamientos claramente horizontales, para no chocar con el zoom
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if(dx < 0){
      viewerIndex = (viewerIndex + 1) % viewerList.length;
    } else {
      viewerIndex = (viewerIndex - 1 + viewerList.length) % viewerList.length;
    }
    showViewerItem();
  }
});
document.getElementById('vEdit').onclick = () => {
  const p = viewerList[viewerIndex];
  viewer.classList.remove('open');
  openForm(p);
};

// ---------- Form ----------
const overlay = document.getElementById('overlay');
const fName = document.getElementById('fName');
const fCat = document.getElementById('fCat');
const fPrice = document.getElementById('fPrice');
const photoPreview = document.getElementById('photoPreview');
const photoHint = document.getElementById('photoHint');
const btnDelete = document.getElementById('btnDelete');

function openForm(product){
  editingId = product ? product.id : null;
  document.getElementById('formTitle').textContent = product ? 'Editar producto' : 'Nuevo producto';
  fName.value = product ? product.name : '';
  fCat.value = product ? (product.category||'') : '';
  fPrice.value = product ? (product.price||'') : '';
  pendingPhoto = product ? product.photo : null;
  if(pendingPhoto){
    photoPreview.src = pendingPhoto;
    photoPreview.style.display = 'block';
    photoHint.style.display = 'none';
  } else {
    photoPreview.style.display = 'none';
    photoHint.style.display = 'block';
  }
  btnDelete.style.display = product ? 'block' : 'none';

  const catList = document.getElementById('catList');
  catList.innerHTML = [...new Set(products.map(p=>p.category).filter(Boolean))]
    .map(c => `<option value="${c}">`).join('');

  overlay.classList.add('open');
}
document.getElementById('btnAdd').onclick = () => openForm(null);
document.getElementById('btnCancel').onclick = () => overlay.classList.remove('open');

document.getElementById('photoFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingPhoto = ev.target.result;
    photoPreview.src = pendingPhoto;
    photoPreview.style.display = 'block';
    photoHint.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('btnSave').onclick = async () => {
  const name = fName.value.trim();
  if(!name){ fName.focus(); return; }
  const product = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    name,
    category: fCat.value.trim(),
    price: fPrice.value ? Number(fPrice.value) : null,
    photo: pendingPhoto,
    createdAt: editingId ? (products.find(p=>p.id===editingId)?.createdAt || Date.now()) : Date.now()
  };
  await saveProduct(product);
  products = await allProducts();
  overlay.classList.remove('open');
  render();
};

btnDelete.onclick = async () => {
  if(!editingId) return;
  if(confirm('¿Eliminar este producto del catálogo?')){
    await deleteProduct(editingId);
    products = await allProducts();
    overlay.classList.remove('open');
    render();
  }
};

// ---------- Init ----------
(async function init(){
  await openDB();
  products = await allProducts();
  render();
})();
</script>
</body>
</html>
